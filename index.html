<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Beamline</title>
    <style>
      html,
      body,
      #scene-container {
        margin: 0;
        height: 100%;
        background: #1c2836;
      }
      #desktop-intro {
        position: fixed;
        z-index: 100000;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(94vw, 920px);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        color: #ffffff;
        font-family: Inter, "Liberation Sans", sans-serif;
        pointer-events: none;
      }
      #desktop-intro h1,
      #desktop-intro p {
        background: #0b121c;
        color: #ffffff;
        border-radius: 12px;
      }
      #desktop-intro h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.01em;
        padding: 6px 14px;
      }
      #desktop-intro p {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.35;
        padding: 10px 16px;
      }
      #desktop-intro[hidden] {
        display: none;
      }
      #webxr-unavailable {
        position: fixed;
        z-index: 100000;
        top: 132px;
        left: 50%;
        transform: translateX(-50%);
        font: 600 18px system-ui, sans-serif;
      }
      #enter-xr {
        position: static;
        z-index: 100000;
        pointer-events: auto;
        font: 600 18px system-ui, sans-serif;
        color: #fff;
        background: #2d7ff9;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #webxr-unavailable {
        margin: 0;
        color: #1b1404;
        background: #f0b429;
        border-radius: 12px;
        padding: 12px 18px;
      }
      #enter-xr[hidden],
      #webxr-unavailable[hidden] {
        display: none;
      }
    </style>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="desktop-intro">
      <h1>Beamline</h1>
      <p>Click Enter XR — works in the built-in emulator, no headset needed</p>
      <button id="enter-xr" type="button" hidden>Enter XR</button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
